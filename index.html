<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission: Escape the Middle East</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Prompt & Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        },
                        desert: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            accent: '#d97706'
                        }
                    },
                    fontFamily: {
                        heading: ['Prompt', 'sans-serif'],
                        body: ['Sarabun', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles & Visual Effects */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0b1120;
            color: #f1f5f9;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-heading {
            font-family: 'Prompt', sans-serif;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Glowing Effects */
        .gold-glow {
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .gold-button {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            transition: all 0.2s ease;
        }

        .gold-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        .gold-button:active {
            transform: translateY(1px);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-gold {
            0%, 100% { border-color: rgba(245, 158, 11, 0.8); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 25px rgba(251, 191, 36, 0.8); }
        }

        .pulse-node {
            animation: pulse-gold 2s infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden">

    <!-- TOP NAVIGATION & VITAL STATS HEADER -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-amber-500/30 px-3 py-2.5 shadow-lg">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
            
            <!-- Game Title & Audio Toggle -->
            <div class="flex items-center gap-2">
                <button id="btn-sound" onclick="sound.toggle()" class="w-9 h-9 rounded-xl bg-slate-800 border border-amber-500/30 flex items-center justify-center text-amber-400 hover:bg-slate-700 transition">
                    <i id="icon-sound" class="fa-solid fa-volume-high text-sm"></i>
                </button>
                <div class="hidden sm:block">
                    <h1 class="text-xs font-heading font-bold text-amber-400 tracking-wider">MISSION: ESCAPE</h1>
                    <p class="text-[10px] text-slate-400">เอเชียตะวันตกเฉียงใต้</p>
                </div>
            </div>

            <!-- Vital Stats (Water, Food, Days) -->
            <div class="flex items-center gap-2 md:gap-4 text-xs font-semibold">
                <!-- Water -->
                <div id="box-stat-water" class="flex items-center gap-1.5 bg-slate-900/90 border border-sky-500/40 px-2.5 py-1.5 rounded-xl shadow-inner transition-all duration-300">
                    <i class="fa-solid fa-droplet text-sky-400 animate-pulse"></i>
                    <div class="flex flex-col">
                        <span class="text-[9px] text-sky-300 leading-none">น้ำดื่ม</span>
                        <span id="stat-water" class="text-sky-200 font-bold leading-tight">100%</span>
                    </div>
                </div>

                <!-- Food -->
                <div id="box-stat-food" class="flex items-center gap-1.5 bg-slate-900/90
